<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PageShot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="icons/icon48.png" alt="" width="20" height="20" />
        <span>PageShot</span>
      </header>

      <label class="switch">
        <span class="switch-label">Open in editor</span>
        <input id="use-editor" type="checkbox" role="switch" />
        <span class="switch-track" aria-hidden="true"></span>
      </label>

      <div class="capture-actions">
        <button id="capture-viewport" type="button">Visible area only</button>
        <button id="capture-full-page" class="secondary-button" type="button">
          Capture full page
        </button>
      </div>

      <div class="status-row" aria-live="polite">
        <span id="status-dot" class="status-dot"></span>
        <span id="status"></span>
      </div>
    </main>

    <script src="store.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
