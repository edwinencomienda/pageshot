<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>PageShot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 4.75V14a1.5 1.5 0 0 0 1.5 1.5h9.25" /><path d="M4.75 8.5H14a1.5 1.5 0 0 1 1.5 1.5v9.25" /></svg>
        </span>
        <span>PageShot</span>
      </header>

      <label class="switch">
        <span class="switch-label">Open in editor</span>
        <input id="use-editor" type="checkbox" role="switch" />
        <span class="switch-track" aria-hidden="true"></span>
      </label>

      <div class="capture-actions">
        <button id="capture-viewport" type="button">Visible area only</button>
        <button id="capture-area" class="secondary-button" type="button">
          Select an area
        </button>
        <button id="capture-full-page" class="secondary-button" type="button">
          Capture full page
        </button>
        <button id="stop" class="secondary-button" type="button" hidden>
          Stop
        </button>
      </div>

      <div class="status-row" aria-live="polite">
        <span id="status-dot" class="status-dot"></span>
        <span id="status"></span>
      </div>
    </main>

    <script src="store.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
