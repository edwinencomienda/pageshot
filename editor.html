<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PageShot — dress up screenshot</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <header>
      <img class="brand-mark" src="icons/icon48.png" alt="" width="24" height="24" />
      <h1>PageShot</h1>
      <div class="history">
        <button id="undo" type="button" aria-label="Undo">↺</button>
        <button id="redo" type="button" aria-label="Redo">↻</button>
      </div>
      <div class="presets">
        <select id="preset-picker" aria-label="Saved presets">
          <option value="">Presets</option>
        </select>
        <button id="preset-save" class="ghost-button" type="button" title="Save the current look as a preset">
          Save
        </button>
        <button id="preset-save-as" class="ghost-button" type="button" title="Save the current look as a new preset" hidden>
          Save as new
        </button>
        <button id="preset-delete" class="ghost-button" type="button" title="Delete the selected preset" disabled>
          Delete
        </button>
      </div>

      <span id="dimensions" class="dimensions"></span>
      <a
        class="repo-link"
        href="https://github.com/edwinencomienda/pageshot"
        target="_blank"
        rel="noreferrer"
        aria-label="PageShot on GitHub"
        title="PageShot on GitHub"
      >
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path
            fill="currentColor"
            d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38l-.01-1.34c-2.23.48-2.7-1.07-2.7-1.07-.36-.93-.89-1.18-.89-1.18-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.72 1.23 1.88.87 2.34.67.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.83-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.22 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.52.56.83 1.28.83 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.2c0 .21.14.46.55.38A8 8 0 0 0 8 0Z"
          />
        </svg>
      </a>
      <a
        class="credit"
        href="https://x.com/edwinencomienda"
        target="_blank"
        rel="noreferrer"
        >Crafted by Edwin Encomienda</a
      >
    </header>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <main>
      <section class="stage">
        <div id="empty" class="empty" hidden>
          <p>No screenshot waiting.</p>
          <p class="empty-hint">
            Click the extension icon, pick <strong>Open in editor</strong>, then
            capture.
          </p>
        </div>
        <div id="frame" class="frame">
          <canvas id="canvas"></canvas>
          <div id="marquee" class="marquee" hidden></div>
        </div>
      </section>

      <aside class="panel">
        <div class="actions actions-top">
          <button id="copy" type="button">
            Copy image <kbd data-key="C"></kbd>
          </button>
          <button id="download" class="secondary-button" type="button">
            Download <kbd data-key="D"></kbd>
          </button>
          <button id="reset" class="secondary-button" type="button">
            Reset to defaults
          </button>
        </div>

        <fieldset>
          <legend>Background</legend>
          <p class="sub">Solid</p>
          <div id="solids" class="swatches" role="radiogroup" aria-label="Solid backgrounds"></div>
          <p class="sub">Gradient</p>
          <div id="gradients" class="swatches" role="radiogroup" aria-label="Gradient backgrounds"></div>
          <p class="sub">Pattern</p>
          <div id="patterns" class="swatches" role="radiogroup" aria-label="Pattern backgrounds"></div>
          <label class="slider-row" id="pattern-density-row">
            <span>Density <output id="pattern-density-value"></output></span>
            <input
              id="pattern-density"
              type="range"
              min="50"
              max="300"
              step="10"
              value="100"
            />
          </label>

          <p class="sub" id="colors-sub" hidden>My colors</p>
          <div id="colors" class="swatches" role="radiogroup" aria-label="My colors"></div>

          <label class="custom-color">
            <input id="color" type="color" value="#1d3b2a" />
            <span>Add solid color</span>
          </label>

          <p class="sub" id="images-sub" hidden>My images</p>
          <div id="images" class="swatches" role="radiogroup" aria-label="My images"></div>

          <label class="upload">
            <input id="upload" type="file" accept="image/*" multiple />
            <span>Add image</span>
          </label>
        </fieldset>

        <fieldset>
          <legend>Padding <output id="padding-value"></output></legend>
          <input id="padding" type="range" min="0" max="14" step="0.5" value="5" />
        </fieldset>

        <fieldset>
          <legend>Corners <output id="radius-value"></output></legend>
          <input id="radius" type="range" min="0" max="48" step="1" value="10" />
        </fieldset>

        <fieldset>
          <legend>Shadow <output id="shadow-value"></output></legend>
          <input id="shadow" type="range" min="0" max="100" step="5" value="10" />
        </fieldset>

        <fieldset>
          <legend>
            Border
            <label class="switch">
              <input id="border" type="checkbox" role="switch" />
              <span class="switch-track" aria-hidden="true"></span>
            </label>
          </legend>
          <div class="custom-row">
            <label class="custom-color">
              <input id="border-color" type="color" value="#17211b" />
              <span id="border-color-label">Color</span>
            </label>
          </div>
          <label class="slider-row">
            <span>Thickness <output id="border-width-value"></output></span>
            <input id="border-width" type="range" min="1" max="24" step="1" value="4" />
          </label>
        </fieldset>

        <fieldset>
          <legend>Crop <output id="crop-value"></output></legend>
          <p class="hint">Drag on the image to keep just that part.</p>
          <button id="crop-reset" class="secondary-button" type="button" disabled>
            Show whole image
          </button>
        </fieldset>

        <p id="status" class="status" aria-live="polite">Ready</p>
      </aside>
    </main>

    <script src="store.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
